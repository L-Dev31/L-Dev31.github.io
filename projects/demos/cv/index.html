:root{
  --paper:#FAF7F2;--ink:#170308;--ink-subtle:#3a1c24;--ink-muted:#6e4e55;--accent:#B31E18;
  --rule:rgba(23,3,8,.16);--rule-dark:#170308;
  --display:"Editorial New","Editorial Old",Georgia,"Times New Roman",serif;
  --body:"Satoshi",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#170308;color:#E6DCDC;font-family:var(--body);font-weight:400}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
input,textarea,button,select{font-family:inherit}

/* ---------- top control bar & editor drawer ---------- */
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px clamp(14px,3vw,28px);background:#170308;border-bottom:1px solid rgba(246,242,242,.12)}
.bar .brand{margin-right:auto;font:italic 400 22px/1 var(--display);color:#F6F2F2;text-decoration:none}
.bar button{min-height:40px;padding:9px 18px;border:1px solid #F6F2F2;border-radius:100px;background:transparent;color:#F6F2F2;font:500 14px/1 var(--body);cursor:pointer;transition:font-weight .15s}
.bar button:hover,.bar button:focus-visible{font-weight:800}
.bar .p{background:#F6F2F2;color:#210710}
.layout{display:flex;justify-content:center;align-items:flex-start;gap:24px;padding:28px 14px 48px}
#editor{width:360px;flex:none;position:sticky;top:76px;max-height:calc(100vh - 100px);overflow-y:auto;padding:14px 16px;border:1px solid rgba(246,242,242,.14);border-radius:14px;background:#210710;font-size:13px;scrollbar-width:thin;scrollbar-color:var(--accent) #210710}
#editor h2{margin:0 0 10px;font:italic 400 24px/1 var(--display);color:#F6F2F2}
.ed-block{margin-bottom:8px;overflow:hidden;border:1px solid rgba(246,242,242,.14);border-radius:10px}
.ed-block>summary{padding:10px 12px;list-style:none;cursor:pointer;font-weight:700;font-size:13px;color:#F6F2F2;background:#170308}
.ed-block>summary::-webkit-details-marker{display:none}
.ed-block .ed-body{display:grid;gap:10px;padding:10px 12px}
.ed-body label{display:grid;gap:4px;font-size:12px;font-weight:600;color:#E6DCDC}
.ed-body input[type=text],.ed-body textarea{width:100%;padding:7px 9px;border:1px solid rgba(246,242,242,.22);border-radius:8px;background:#170308;color:#F6F2F2;font:inherit;font-size:13px}
.ed-body textarea{min-height:64px;resize:vertical}
.ed-row{display:flex;gap:6px;align-items:center}
.ed-row input{flex:1;min-width:0}
.ed-item{display:grid;gap:8px;padding:9px;border:1px dashed rgba(246,242,242,.26);border-radius:8px}
.ed-add{padding:7px 10px;border:1px solid #F6F2F2;border-radius:100px;background:transparent;color:#F6F2F2;font:600 12px var(--body);cursor:pointer}
.ed-del{justify-self:end;padding:3px 10px;border:1px solid #ff8a80;border-radius:100px;background:transparent;color:#ff8a80;font:600 12px var(--body);cursor:pointer}
.ed-icon-prev{display:grid;place-items:center;flex:none;width:34px;height:34px;overflow:hidden;border-radius:8px;background:#fff}
.ed-icon-prev img{width:100%;height:100%;object-fit:contain;padding:4px}
@media (max-width:1240px){.layout{flex-direction:column;align-items:center}#editor{position:static;width:min(794px,100%);max-height:none}}

/* =================================================================
   THE BROADSHEET / MAGAZINE SHEET ("THE TIMES" EDITORIAL DESIGN)
   ================================================================= */
.cv{
  position:relative;width:794px;height:1123px;margin:0 auto;overflow:hidden;
  background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:11px;line-height:1.42;box-shadow:0 12px 60px rgba(0,0,0,.5);
}
.cv a{text-decoration:none;color:inherit}
.cv a:hover{text-decoration:underline}
.cv ul{margin:0;padding:0;list-style:none}
.cv p{margin:0}

.cv-page{
  padding:22px 26px 18px;display:flex;flex-direction:column;height:100%;
}

/* --- Rules & Dividers --- */
.oxford-double{height:4px;border-top:2px solid var(--rule-dark);border-bottom:.75px solid var(--rule-dark);margin:4px 0 8px;flex:none}
.oxford-single{border-bottom:.75px solid var(--rule);margin:6px 0;flex:none}

/* --- Folio bar (Top Dateline) --- */
/* --- Masthead --- */
.masthead{text-align:center;padding:4px 0 2px}
.masthead-title{
  margin:0;font:italic 400 58px/.9 var(--display);letter-spacing:-.025em;color:var(--ink);
}
.masthead-kicker{
  margin:6px 0 0;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
}

/* --- Lead Story Headline & Deck --- */
.lead-headline{margin:8px 0 14px}
.lead-title{
  margin:0 0 8px;font:italic 400 36px/.98 var(--display);letter-spacing:-.015em;color:var(--ink);
}
.lead-deck{
  display:flex;align-items:center;gap:12px;padding:6px 0;
  border-top:.75px solid var(--rule);border-bottom:.75px solid var(--rule);
  font-size:11px;font-weight:500;color:var(--ink-subtle);
}
.deck-item b{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.deck-sep{color:var(--rule);font-weight:300}
.deck-live{color:var(--accent);font-weight:600}

/* --- Editorial Grid (Sidebar + Main) --- */
.broadsheet-grid{
  display:grid;grid-template-columns:210px 1fr;gap:0 18px;flex:1;min-height:0;
}

/* --- Left Column (Dossier & Directory) --- */
.col-side{
  border-right:.75px solid var(--rule);padding-right:16px;
  display:flex;flex-direction:column;gap:8px;min-width:0;
}
.portrait-figure{margin:0 0 4px;width:100%;text-align:center;display:flex;justify-content:center}
.portrait-img{
  width:100%;max-width:128px;height:auto;aspect-ratio:1/1;object-fit:contain;display:block;
  border:1px solid var(--rule-dark);
  filter:grayscale(100%) contrast(1.25) brightness(.95);
  mix-blend-mode:multiply;
}
.portrait-fallback{
  width:100%;max-width:128px;aspect-ratio:1/1;background:#e8e2d8;display:grid;place-items:center;
  border:1px solid var(--rule-dark);font:italic 400 36px var(--display);color:var(--ink-muted);
}

.side-contacts{display:flex;flex-direction:column;gap:3px}
.side-contacts li{
  display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:600;
  color:var(--ink);word-break:break-word;
}
.side-contacts li a{color:inherit;text-decoration:none}
.side-contacts li a:hover{text-decoration:underline;color:var(--accent)}
.contact-ico{width:12px;height:12px;flex:none;opacity:.75;filter:brightness(0)}

.side-infos{display:flex;flex-direction:column;gap:4px;font-size:10.5px;line-height:1.35;color:var(--ink-subtle)}
.side-info-item{display:flex;align-items:flex-start;gap:7px}
.side-sec{display:flex;flex-direction:column;gap:4px}
.side-title{
  margin:0;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink);padding-bottom:3px;border-bottom:.75px solid var(--ink);
}
.side-list{display:flex;flex-direction:column;gap:3px}
.side-list li{position:relative;padding-left:11px;font-size:10.5px;font-weight:500;line-height:1.35;color:var(--ink)}
.side-list li:before{content:"";position:absolute;left:0;top:.6em;width:4.5px;height:4.5px;background:var(--accent)}

.tech-directory{display:flex;flex-direction:column;gap:4px;font-size:9.5px;line-height:1.34}
.tech-row{color:var(--ink-subtle)}
.tech-group-name{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.tech-tool-name{color:var(--ink);font-weight:500}

.keywords-footnote{
  margin-top:auto;padding-top:6px;border-top:.5px solid var(--rule);
  font-size:8.5px;line-height:1.35;font-style:italic;color:var(--ink-muted);
}
.keywords-footnote b{font-style:normal;font-weight:700;text-transform:uppercase;font-size:7.5px;letter-spacing:.06em}

/* --- Right Column (Expériences & Articles) --- */
.col-main{display:flex;flex-direction:column;gap:20px;min-width:0;overflow:hidden}
.editorial-sec{margin:0}
.sec-head{
  display:flex;align-items:center;gap:8px;margin:0 0 10px;
  border-bottom:1.5px solid var(--ink);padding-bottom:3px;
}
.sec-head-text{
  font:italic 400 24px/1 var(--display);letter-spacing:-.01em;color:var(--ink);
}
.exp-articles{display:flex;flex-direction:column;gap:14px}
.exp-article{padding-bottom:13px;border-bottom:.5px dashed var(--rule)}
.exp-article:last-child{border-bottom:none;padding-bottom:0}

.article-header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.article-headline{font-size:15px;font-weight:800;color:var(--ink);margin:0;letter-spacing:-.01em}
.article-subplace{font-weight:500;color:var(--ink-muted);font-size:12px}
.article-dateline{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.article-subhead{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin:2px 0 7px}
.article-content{display:flex;gap:12px;align-items:flex-start}
.article-points{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.article-points li{position:relative;padding-left:13px;font-size:12px;line-height:1.42;color:var(--ink)}
.article-points li:before{content:"";position:absolute;left:0;top:.55em;width:5.5px;height:5.5px;background:var(--accent)}

.article-content{display:block}

.edu-articles{display:flex;flex-direction:column;gap:11px}
.edu-article{display:flex;flex-direction:column;gap:1px}
.edu-degree{font-size:12.5px;font-weight:700;color:var(--ink);margin:0}
.edu-extra{font-size:11px;color:var(--ink-muted);font-style:italic;margin:0}

.interests-block{display:flex;flex-direction:column;gap:5px;font-size:11.5px;line-height:1.4}
.interest-line b{font-weight:800;text-transform:uppercase;font-size:10px;letter-spacing:.08em;color:var(--accent)}

/* --- Click to Edit hover effect --- */
@media screen{
  [data-target]{cursor:pointer;outline:1.5px solid transparent;border-radius:2px;transition:outline-color .15s,background .15s}
  [data-target]:hover{background:rgba(179,30,24,.08);outline:1.5px dashed rgba(179,30,24,.6)}
}

/* --- Mode ATS --- */
.ats .cv{background:#fff;color:#000;box-shadow:none}
.ats .portrait-img{display:none}
.ats .oxford-double{border-color:#000}
.ats .lead-deck{border-color:#000}
.ats .side-list li:before,.ats .article-points li:before{background:#000}
.ats .deck-live,.ats .masthead-kicker,.ats .article-dateline,.ats .interest-line b{color:#000}

/* --- Responsive mobile view --- */
@media screen and (max-width:860px){
  .layout{padding:0 0 32px}
  .cv{width:100%;height:auto;box-shadow:none}
  .cv-page{padding:20px max(16px,4vw)}
  .broadsheet-grid{display:block}
  .col-side{border-right:none;padding-right:0;padding-bottom:16px;border-bottom:1px solid var(--rule);margin-bottom:16px}
  .article-content{flex-direction:column;gap:6px}
  .callout-stats-wrap{flex-direction:row;width:100%}
  #editor{margin:0 14px}
}

@page{size:A4;margin:0}
@media print{
  html,body{background:#fff}
  .bar,.layout{padding:0}.bar,#editor{display:none!important}
  .layout{display:block}
  .cv{width:210mm;height:296.5mm;margin:0;box-shadow:none;background:#fff}
  [data-target]{cursor:auto!important;outline:none!important;background:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// The sheet is one A4 page: a column that is too long shrinks a little. On a narrow screen the page just flows.
function fitColumn(box){

 inner.style.zoom=1;
 if(matchMedia('screen and (max-width:860px)').matches)return;

 while(inner.getBoundingClientRect().height>room+1&&z>0.8){z-=0.01;inner.style.zoom=z.toFixed(2);}
}
function fit(){fitColumn(cv);}
function toggleAts(){ats=!ats;cv.classList.toggle('ats',ats);fit();document.getElementById('ats').textContent='Mode ATS : '+(ats?'activé':'désactivé');}

function exportProject(){
 var s="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(CV,null,2));
 var a=document.createElement('a');a.href=s;a.download="cv_projet.json";
 document.body.appendChild(a);a.click();a.remove();
}
function importProject(e){
 var f=e.target.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(ev){try{CV=JSON.parse(ev.target.result);refresh();}catch(err){alert("Erreur JSON");}e.target.value='';};
 r.readAsText(f);
}

var iconTarget=null;
function triggerIconUpload(p){iconTarget=p;document.getElementById('icon_upload').click();}
function handleIconUpload(e){
 var f=e.target.files[0];if(!f||!iconTarget)return;var r=new FileReader();
 r.onload=function(ev){setPath(iconTarget,ev.target.result);e.target.value='';iconTarget=null;};
 r.readAsDataURL(f);
}
function handlePhotoUpload(e){
 var f=e.target.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(ev){CV.photo=ev.target.result;refresh();};
 r.readAsDataURL(f);
}

function renderCV(){
 var initials=esc((CV.name||'').split(/\s+/).map(function(w){return w.charAt(0)}).join('').slice(0,2).toUpperCase());

 var h='<div class="cv-page">';

 // 1. OXFORD DOUBLE RULE & MASTHEAD
 h+='<div class="oxford-double"></div>';
 h+='<header class="masthead">';
 h+='<h1 class="masthead-title" data-target="inp_name">'+esc(CV.name)+'</h1>';
 h+='<p class="masthead-kicker" data-target="inp_role">'+esc(CV.role)+'</p>';
 h+='</header>';
 h+='<div class="oxford-double"></div>';

 // 2. LEAD HEADLINE
 h+='<section class="lead-headline">';
 h+='<h2 class="lead-title" data-target="inp_title">'+nl2br(CV.title)+'</h2>';
 h+='<div class="lead-deck">';
 h+='<span class="deck-item" data-target="inp_rhythm"><b>Rythme :</b> '+esc(CV.rhythm)+'</span>';
 h+='<span class="deck-sep">/</span>';
 h+='<span class="deck-item deck-live" data-target="inp_dispo"><b>Disponibilité :</b> '+esc(CV.dispo)+'</span>';
 h+='</div>';
 h+='</section>';

 // 3. BROADSHEET GRID
 h+='<div class="broadsheet-grid">';

 // --- LEFT COLUMN (DOSSIER & DIRECTORY) ---
 h+='<aside class="col-side">';

 // Editorial Portrait (Newspaper filter, full, uncropped)
 h+='<figure class="portrait-figure" data-target="inp_photo" title="Changer la photo">';
 if(CV.photo){
   h+='<img class="portrait-img" src="'+esc(CV.photo)+'" alt="Portrait de '+esc(CV.name)+'">';
 } else {
   h+='<div class="portrait-fallback"><span>'+initials+'</span></div>';
 }
 h+='</figure>';

 // Réseaux & Contacts (sous le portrait)
 h+='<section class="side-sec">';
 h+='<h3 class="side-title">Contact & Réseaux</h3>';
 h+='<ul class="side-contacts">';
 CV.contacts.forEach(function(c,i){
   h+='<li data-target="inp_contacts_'+i+'_text">'+logoHtml('',c.icon,'','contact-ico')+'<a href="'+esc(c.href)+'">'+esc(c.text)+'</a></li>';
 });
 h+='</ul>';
 h+='</section>';

 // Informations (sous le portrait)
 h+='<section class="side-sec">';
 h+='<h3 class="side-title">Informations</h3>';
 h+='<div class="side-infos">';
 CV.infos.forEach(function(b,i){
   h+='<div class="side-info-item" data-target="inp_infos_'+i+'_text">'+logoHtml('',b.icon,'','contact-ico')+'<span>'+nl2br(b.text)+'</span></div>';
 });
 h+='</div>';
 h+='</section>';

 // Savoir-être
 h+='<section class="side-sec">';
 h+='<h3 class="side-title">Savoir-être</h3>';
 h+='<ul class="side-list">';
 CV.savoirEtre.forEach(function(x,i){
   h+='<li data-target="inp_savoirEtre_'+i+'">'+esc(x)+'</li>';
 });
 h+='</ul>';
 h+='</section>';

 // Savoir-faire
 h+='<section class="side-sec">';
 h+='<h3 class="side-title">Savoir-faire</h3>';
 h+='<ul class="side-list">';
 CV.savoirFaire.forEach(function(x,i){
   h+='<li data-target="inp_savoirFaire_'+i+'">'+esc(x)+'</li>';
 });
 h+='</ul>';
 h+='</section>';

 // Index des technologies (typographic directory)
 h+='<section class="side-sec">';
 h+='<h3 class="side-title">Outils & Maîtrise</h3>';
 h+='<div class="tech-directory">';
 CV.softRows.forEach(function(row,ri){
   row.forEach(function(g,gi){
     h+='<div class="tech-row">';
     h+='<b class="tech-group-name" data-target="inp_softRows_'+ri+'_'+gi+'_group">'+esc(g.group)+' :</b> ';
     var tools = g.items.map(function(t,ii){
       return '<span class="tech-tool-name" data-target="inp_softRows_'+ri+'_'+gi+'_items_'+ii+'_label">'+esc(t.label)+'</span>';
     }).join(', ');
     h+=tools+'</div>';
   });
 });
 h+='</div>';
 h+='</section>';

 // Keywords footnote
 if(CV.keywords){
   h+='<div class="keywords-footnote" data-target="inp_keywords">';
   h+='<b>Mots-clés :</b> '+esc(CV.keywords);
   h+='</div>';
 }

 h+='</aside>';

 // --- RIGHT COLUMN (EXPÉRIENCES & ARTICLES) ---
 h+='<main class="col-main">';

 // Expériences (sans container de chiffres clés)
 h+='<section class="editorial-sec">';
 h+='<h3 class="sec-head"><span class="sec-head-text">Expériences Professionnelles</span></h3>';
 h+='<div class="exp-articles">';
 CV.experiences.forEach(function(x,i){
   h+='<article class="exp-article" data-target="inp_experiences_'+i+'_company">';
   h+='<div class="article-header">';
   h+='<h4 class="article-headline">'+esc(x.company)+(x.place?' <span class="article-subplace">('+esc(x.place)+')</span>':'')+'</h4>';
   h+='<span class="article-dateline">'+esc(x.date)+'</span>';
   h+='</div>';
   h+='<p class="article-subhead">'+esc(x.role)+'</p>';
   h+='<div class="article-content">';
   h+='<ul class="article-points">'+lines(x.points).map(function(l){return '<li>'+esc(l)+'</li>';}).join('')+'</ul>';
   h+='</div>';
   h+='</article>';
 });
 h+='</div>';
 h+='</section>';

 // Formation
 h+='<section class="editorial-sec">';
 h+='<h3 class="sec-head"><span class="sec-head-text">Formation Académique</span></h3>';
 h+='<div class="edu-articles">';
 CV.education.forEach(function(x,i){
   h+='<article class="edu-article" data-target="inp_education_'+i+'_school">';
   h+='<div class="article-header">';
   h+='<h4 class="article-headline">'+esc(x.school)+'</h4>';
   h+='<span class="article-dateline">'+esc(x.date)+'</span>';
   h+='</div>';
   h+='<p class="edu-degree">'+esc(x.degree)+'</p>';
   if(x.extra) h+='<p class="edu-extra">'+esc(x.extra)+'</p>';
   h+='</article>';
 });
 h+='</div>';
 h+='</section>';

 // Centres d'intérêt
 h+='<section class="editorial-sec">';
 h+='<h3 class="sec-head"><span class="sec-head-text">Centres d’intérêt & Culture</span></h3>';
 h+='<div class="interests-block">';
 CV.interests.forEach(function(x,i){
   h+='<p class="interest-line" data-target="inp_interests_'+i+'_text"><b>'+esc(x.label)+'</b> — '+esc(x.text)+'</p>';
 });
 h+='</div>';
 h+='</section>';

 h+='</main>';
 h+='</div>'; // broadsheet-grid

 h+='</div>'; // cv-page

 cv.innerHTML=h;
 fit();
}

cv.addEventListener('click',function(e){
 if(ats)return;
 var t=e.target.closest('[data-target]');if(!t)return;
 if(e.target.closest('a'))return;
 var id=t.getAttribute('data-target');
 if(id==='inp_photo'){document.getElementById('ph').click();return;}
 var el=document.getElementById(id);
 if(el){var d=el.closest('details');if(d)d.open=true;el.scrollIntoView({behavior:'smooth',block:'center'});el.focus();}
});

function path2id(p){return 'inp_'+p.replace(/\./g,'_');}
function fld(p,v,ph){return '<input type="text" id="'+path2id(p)+'" value="'+esc(v)+'" placeholder="'+esc(ph||"")+'" oninput="setPath(\''+p+'\',this.value)">';}
function fldIcon(p,v){return '<div class="ed-row"><div class="ed-icon-prev">'+logoHtml('',v,'','')+'</div>'+fld(p,v)+'<button type="button" class="ed-add" onclick="triggerIconUpload(\''+p+'\')">Fichier</button></div>';}
function area(p,v,ph){return '<textarea id="'+path2id(p)+'" placeholder="'+esc(ph||"")+'" oninput="setPath(\''+p+'\',this.value)">'+esc(v)+'</textarea>';}
function setPath(p,v){var o=CV,ks=p.split('.');for(var i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v;save();renderCV();}
function refresh(){var s=saveOpenState();save();renderCV();renderEditor();restoreOpenState(s);}
function block(t,i){return '<details class="ed-block"><summary>'+t+'</summary><div class="ed-body">'+i+'</div></details>';}

function renderEditor(){
 var e='';
 e+=block('En-tête et photo','<label>Nom'+fld('name',CV.name)+'</label><label>Sous le nom'+fld('role',CV.role)+'</label><button type="button" class="ed-add" onclick="document.getElementById(\'ph\').click()">Changer la photo</button>');
 e+=block('Contacts',CV.contacts.map(function(c,i){return '<div class="ed-item"><label>Icône'+fldIcon('contacts.'+i+'.icon',c.icon)+'</label><label>Texte'+fld('contacts.'+i+'.text',c.text)+'</label><label>Lien'+fld('contacts.'+i+'.href',c.href)+'</label><button type="button" class="ed-del" onclick="CV.contacts.splice('+i+',1);refresh()">Supprimer</button></div>';}).join('')+'<button type="button" class="ed-add" onclick="CV.contacts.push({icon:\'icons/link.svg\',text:\'Nouveau\',href:\'#\'});refresh()">Ajouter</button>');
 e+=block('Infos',CV.infos.map(function(b,i){return '<div class="ed-item"><label>Icône'+fldIcon('infos.'+i+'.icon',b.icon)+'</label><label>Texte'+area('infos.'+i+'.text',b.text)+'</label><button type="button" class="ed-del" onclick="CV.infos.splice('+i+',1);refresh()">Supprimer</button></div>';}).join('')+'<button type="button" class="ed-add" onclick="CV.infos.push({icon:\'icons/pin.svg\',text:\'Info\'});refresh()">Ajouter</button>');
 e+=block('Titre','<label>Titre'+area('title',CV.title)+'</label><label>Rythme'+fld('rhythm',CV.rhythm)+'</label><label>Disponibilité'+fld('dispo',CV.dispo)+'</label>');

 function listEd(p,arr){return arr.map(function(x,i){return '<div class="ed-row"><input type="text" id="inp_'+p+'_'+i+'" value="'+esc(x)+'" oninput="CV[\''+p+'\']['+i+']=this.value;save();renderCV()"><button type="button" class="ed-del" onclick="CV[\''+p+'\'].splice('+i+',1);refresh()">✕</button></div>';}).join('')+'<button type="button" class="ed-add" onclick="CV[\''+p+'\'].push(\'Nouveau\');refresh()">Ajouter</button>';}
 e+=block('Compétences','<label>Savoir-être</label>'+listEd('savoirEtre',CV.savoirEtre)+'<br><label>Savoir-faire</label>'+listEd('savoirFaire',CV.savoirFaire));

 var sh='';
 CV.softRows.forEach(function(row,ri){row.forEach(function(g,gi){
  sh+='<div class="ed-item"><label>Groupe'+fld('softRows.'+ri+'.'+gi+'.group',g.group)+'</label>';
  g.items.forEach(function(t,ii){var p='softRows.'+ri+'.'+gi+'.items.'+ii;
   sh+='<div class="ed-item"><label>Outil'+fld(p+'.label',t.label)+'</label><label>Logo'+fldIcon(p+'.logo',t.logo)+'</label><button type="button" class="ed-del" onclick="CV.softRows['+ri+']['+gi+'].items.splice('+ii+',1);refresh()">Supprimer</button></div>';});
  sh+='<button type="button" class="ed-add" onclick="CV.softRows['+ri+']['+gi+'].items.push({label:\'Outil\',logo:\'mdi:application\'});refresh()">Ajouter un outil</button></div>';});});
 e+=block('Logiciels',sh);
 e+=block('Mots-clés','<label>Texte'+area('keywords',CV.keywords)+'</label>');
 e+=block('Expériences',CV.experiences.map(function(x,i){return '<div class="ed-item"><label>Date'+fld('experiences.'+i+'.date',x.date)+'</label><label>Entreprise'+fld('experiences.'+i+'.company',x.company)+'</label><label>Précision'+fld('experiences.'+i+'.place',x.place)+'</label><label>Poste'+fld('experiences.'+i+'.role',x.role)+'</label><label>Points (un par ligne)'+area('experiences.'+i+'.points',x.points)+'</label><label>Chiffres (valeur | libellé, un par ligne)'+area('experiences.'+i+'.stats',x.stats)+'</label><button type="button" class="ed-del" onclick="CV.experiences.splice('+i+',1);refresh()">Supprimer</button></div>';}).join('')+'<button type="button" class="ed-add" onclick="CV.experiences.push({date:\'2026\',company:\'Entreprise\',place:\'\',role:\'Poste\',points:\'Mission\',stats:\'\'});refresh()">Ajouter</button>');
 e+=block('Formation',CV.education.map(function(x,i){return '<div class="ed-item"><label>Date'+fld('education.'+i+'.date',x.date)+'</label><label>École'+fld('education.'+i+'.school',x.school)+'</label><label>Diplôme'+fld('education.'+i+'.degree',x.degree)+'</label><label>Détails'+fld('education.'+i+'.extra',x.extra)+'</label><button type="button" class="ed-del" onclick="CV.education.splice('+i+',1);refresh()">Supprimer</button></div>';}).join('')+'<button type="button" class="ed-add" onclick="CV.education.push({date:\'2026\',school:\'École\',degree:\'Diplôme\',extra:\'\'});refresh()">Ajouter</button>');
 e+=block('Centres d’intérêt',CV.interests.map(function(x,i){return '<div class="ed-item"><label>Catégorie'+fld('interests.'+i+'.label',x.label)+'</label><label>Texte'+area('interests.'+i+'.text',x.text)+'</label><button type="button" class="ed-del" onclick="CV.interests.splice('+i+',1);refresh()">Supprimer</button></div>';}).join('')+'<button type="button" class="ed-add" onclick="CV.interests.push({label:\'Art\',text:\'Texte\'});refresh()">Ajouter</button>');

 document.getElementById('editor').innerHTML='<h2>Éditeur</h2>'+e;
}

function saveOpenState(){return Array.prototype.map.call(document.querySelectorAll('#editor details'),function(d){return d.open;});}
function restoreOpenState(s){Array.prototype.forEach.call(document.querySelectorAll('#editor details'),function(d,i){if(s[i]!==undefined)d.open=s[i];});}

window.addEventListener('beforeprint',fit);
window.addEventListener('resize',fit);
if(document.fonts)document.fonts.ready.then(fit);
window.addEventListener('load',function(){fit();setTimeout(fit,600);});
renderCV();renderEditor();
</script>
</body>
</html>
