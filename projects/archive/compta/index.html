<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Axonis — Comptabilité</title>
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@25.11.2/build/css/intlTelInput.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body data-tab="form">
  <header class="nav">
    <svg class="brand" viewBox="0 0 98.09 98.09" role="img" aria-label="Axonis"><path d="M98.09,0l-27.4,43.6c-2.09,3.33-2.09,7.55,0,10.88l27.4,43.6-43.6-27.4c-3.33-2.09-7.55-2.09-10.88,0L0,98.09l27.4-43.6c2.09-3.33,2.09-7.55,0-10.88L0,0l43.6,27.4c3.33,2.09,7.55,2.09,10.88,0L98.09,0Z"/></svg>
    <div class="menu-wrap">
      <button type="button" id="menuBtn" class="menu-btn" aria-controls="menu" aria-expanded="false" aria-label="Menu">
        <span>Fichier</span><i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
      <div id="menu" class="menu" role="menu">
        <button type="button" data-action="export"><i class="fa-solid fa-file-arrow-down"></i>Exporter XLSX</button>
        <button type="button" data-action="import"><i class="fa-solid fa-file-import"></i>Importer XLSX</button>
        <button type="button" data-action="wipe" class="warning"><i class="fa-solid fa-trash"></i>Vider la table</button>
      </div>
    </div>
    <button type="button" id="profileBtn" class="profile company-only" hidden>
      <div class="pfp company-pfp"></div>
      <div class="profile-text">
        <strong class="company-name"></strong>
        <span class="company-job"></span>
      </div>
    </button>
    <button type="button" id="loginBtn" class="login secondary guest-only" hidden><i class="fa-solid fa-circle-user"></i>Se connecter</button>
  </header>
  <div id="backdrop" class="backdrop"></div>
  <input id="importInput" type="file" accept=".csv,text/csv,.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <input id="companyImportInput" type="file" accept=".axo" hidden>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="form" aria-selected="true" aria-controls="form-container"><i class="fa-solid fa-file-pen"></i><span>Formulaire</span></button>
    <button type="button" role="tab" data-tab="preview" aria-selected="false" aria-controls="preview-container"><i class="fa-solid fa-eye"></i><span>Aperçu</span></button>
    <button type="button" role="tab" data-tab="account" aria-selected="false" aria-controls="account-container" class="tab-account">
      <span class="pfp company-pfp company-only" hidden></span><i class="fa-solid fa-circle-user guest-only"></i><span>Compte</span>
    </button>
  </nav>

  <main class="split">
    <section class="pane" id="form-container">
      <form id="rowForm" autocomplete="off">
        <h1 id="formTitle">Nouvelle facture</h1>
        <div class="grid">
          <div class="pair">
            <div class="field">
              <label for="invoice_number">Numéro de facture</label>
              <input type="text" id="invoice_number" placeholder="Ex. 2025-1" required>
            </div>
            <div class="field">
              <label for="invoice_date">Date de la facture</label>
              <input type="date" id="invoice_date" required>
            </div>
          </div>
          <div class="pair">
            <div class="field">
              <label for="client_type">Type de client</label>
              <select id="client_type">
                <option value="b2c">Particulier</option>
                <option value="b2b">Professionnel</option>
              </select>
            </div>
            <div class="field" id="clientSirenField" hidden>
              <label for="client_siren">SIREN du client</label>
              <input type="text" id="client_siren" inputmode="numeric" maxlength="9" placeholder="123456789">
            </div>
          </div>
          <div class="pair">
            <div class="field">
              <label for="client_name" id="clientNameLabel">Nom et prénom du client</label>
              <input type="text" id="client_name" placeholder="Nom Prénom" required>
            </div>
            <div class="field">
              <label for="client_email">Email <small class="opt">(optionnel)</small></label>
              <input type="email" id="client_email" placeholder="email@exemple.com">
              <div id="emailError" class="field-error" hidden>Adresse e-mail invalide</div>
            </div>
          </div>
          <div class="field">
            <label for="client_address">Adresse du client <small class="opt" id="clientAddressOpt">(optionnel)</small></label>
            <input type="text" id="client_address" placeholder="Ligne d'adresse">
            <div class="pair account-location">
              <input type="text" id="client_postal_code" placeholder="75001" aria-label="Code postal du client">
              <input type="text" id="client_city" placeholder="Paris" aria-label="Ville du client">
            </div>
          </div>
          <div class="field">
            <label for="payment_method">Mode de règlement</label>
            <div class="pay-row">
              <img id="payLogo" class="pay-logo" alt="" hidden>
              <select id="payment_method" required>
                <option value="" disabled selected>Sélectionner</option>
                <option data-logo="images/payments/especes.png">Espèces</option>
                <option data-logo="images/payments/cheque.png">Chèque</option>
                <option data-logo="images/payments/virement.png">Virement bancaire</option>
                <option data-logo="images/payments/carte.png">Carte bancaire</option>
                <option data-logo="images/payments/wero.png">Wero</option>
                <option data-logo="images/payments/sumup.png">SumUp</option>
                <option>Autre</option>
              </select>
            </div>
          </div>
          <div class="field" id="pmOther" hidden>
            <label for="payment_method_other">Précisez le mode de règlement</label>
            <input type="text" id="payment_method_other" placeholder="Précisez le mode de règlement…">
          </div>
          <div class="field">
            <label for="payment_note">Référence / note paiement <small class="opt">(optionnel)</small></label>
            <input type="text" id="payment_note" placeholder="Ex: virement le 02/08/24, ch 7185423">
          </div>

          <div class="field">
            <label>Prestation(s)</label>
            <div id="services"></div>
          </div>
          <div><button type="button" id="addLineBtn" class="secondary"><i class="fa-solid fa-plus"></i>Ajouter une prestation</button></div>

          <div class="total">
            <div class="small">Total</div>
            <div id="priceBig">0,00 €</div>
          </div>
        </div>

        <div class="controls">
          <button id="addBtn" type="submit" disabled>
            <span class="only-new"><i class="fa-solid fa-plus"></i>Entrer</span>
            <span class="only-edit"><i class="fa-solid fa-save"></i>Mettre à jour</span>
          </button>
          <button id="downloadBtn" type="button" disabled><i class="fa-solid fa-download"></i>Télécharger</button>
          <button id="sendBtn" type="button" disabled title="Envoie le PDF puis ajoute la ligne au tableau"><i class="fa-solid fa-paper-plane"></i>Envoyer et Entrer</button>
          <button id="cancelBtn" type="button" class="secondary only-edit">Annuler</button>
        </div>
      </form>
    </section>

    <section class="pane" id="preview-container">
      <h2>Aperçu</h2>
      <article id="previewCard" class="card">
        <div class="pfp" id="previewPfp">?</div>
        <div class="info">
          <div class="row">
            <div>
              <strong id="previewClient">Nom Prénom</strong>
              <div class="meta lines" id="previewService">Prestation</div>
              <div class="meta email" id="previewEmail" hidden></div>
            </div>
            <div class="amount" id="previewTotal">0,00 €</div>
          </div>
          <div class="row">
            <div class="meta" id="previewInvoice">N° — • —</div>
            <div class="meta" id="previewPayment">Mode paiement</div>
          </div>
        </div>
      </article>

      <div class="list-tools">
        <select id="sortOrder" title="Ordre d'affichage">
          <option value="desc">Plus récentes en haut</option>
          <option value="asc">Plus anciennes en haut</option>
        </select>
        <div class="search">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input id="searchInput" type="search" placeholder="Rechercher (nom ou n° facture)" aria-label="Recherche par nom ou numéro">
        </div>
        <div id="clientsCount">0 clients enregistrés</div>
      </div>
      <div class="total-line">Total <strong id="listTotal">0,00 €</strong></div>
      <div id="cardsList"></div>
    </section>

    <section class="pane" id="account-container">
      <h2>Compte</h2>
      <div class="company-only account-slot" hidden></div>
      <div class="account-card guest-only" hidden>
        <div class="pfp"><i class="fa-solid fa-user"></i></div>
        <strong>Non connecté</strong>
        <button type="button" class="login secondary"><i class="fa-solid fa-circle-user"></i>Se connecter</button>
      </div>
    </section>
  </main>

  <div class="toast" role="status" aria-live="polite" popover="manual"></div>

  <dialog id="accountDialog" class="app-dialog">
    <button type="button" class="dialog-close" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>
    <div class="company-only account-slot" hidden></div>
    <div class="account-card guest-only" hidden>
      <div class="pfp"><i class="fa-solid fa-user"></i></div>
      <strong>Non connecté</strong>
      <button type="button" class="login secondary"><i class="fa-solid fa-circle-user"></i>Se connecter</button>
    </div>
  </dialog>

  <dialog id="servicesDialog" class="app-dialog">
    <button type="button" class="dialog-close" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>
    <form class="dialog-form services-form">
      <h2 class="services-title">Prestations</h2>
      <div class="services-list"></div>
      <button type="button" class="secondary" id="addServiceBtn"><i class="fa-solid fa-plus"></i>Ajouter une prestation</button>
      <button type="submit" disabled><i class="fa-solid fa-check"></i>Enregistrer</button>
      <button type="button" class="secondary dialog-back"><i class="fa-solid fa-arrow-left"></i>Retour</button>
    </form>
  </dialog>

  <template id="serviceRowTpl">
    <div class="service-row">
      <div class="field">
        <label>Nom<input type="text" class="svc-cfg-label" placeholder="Ex. Massage bien-être (60min)"></label>
      </div>
      <div class="field svc-cfg-price-field">
        <label>Prix (€)<input type="number" class="svc-cfg-price" min="0" step="0.01" placeholder="0"></label>
      </div>
      <div class="field svc-cfg-pro-field">
        <label>Profession<select class="svc-cfg-pro"></select></label>
      </div>
      <button type="button" class="secondary danger svc-cfg-rm" title="Retirer"><i class="fa-solid fa-trash"></i></button>
    </div>
  </template>

  <template id="accountTpl">
    <form class="dialog-form account-form">
      <div class="account-cols">
        <div class="account-col">
          <h3 class="account-col-title">Identité</h3>
          <div class="pair account-images">
            <label class="account-logo" title="Changer le logo">
              <span class="account-logo-img">
                <div class="pfp company-pfp"></div>
                <span class="account-logo-edit"><i class="fa-solid fa-pen"></i></span>
              </span>
              <input type="file" accept="image/*" data-field="logo" hidden>
              <span class="account-image-label">Logo</span>
            </label>
            <label class="account-logo" title="Changer le tampon">
              <span class="account-logo-img">
                <img class="stamp-preview pfp" alt="">
                <span class="account-logo-edit"><i class="fa-solid fa-pen"></i></span>
              </span>
              <input type="file" accept="image/*" data-field="stamp" hidden>
              <span class="account-image-label">Tampon</span>
            </label>
          </div>
            <div class="field">
              <label>Nom<input type="text" class="account-name-input" data-field="name" placeholder="Nom de l'entreprise"></label>
            </div>
            <div class="field">
              <label>Profession<input type="text" class="account-job-input" data-field="profession" placeholder="Profession"></label>
            </div>
          <div class="field">
            <label>Prestation(s)</label>
            <button type="button" class="secondary open-services-btn"><i class="fa-solid fa-list"></i>Prestations</button>
          </div>
          <div class="field">
            <label>Thème de couleurs</label>
            <div class="theme-presets"></div>
          </div>
        </div>
        <div class="account-col">
          <h3 class="account-col-title">Coordonnées et envoi</h3>
          <div class="field">
            <label>Adresse<input type="text" data-field="addressLine1" placeholder="Ligne 1"></label>
          </div>
          <div class="field">
            <label><input type="text" data-field="addressLine2" placeholder="Ligne 2 (optionnel)"></label>
          </div>
          <div class="field">
            <label>Ville</label>
            <div class="pair account-location">
              <input type="text" data-field="postalCode" placeholder="75001" aria-label="Code postal">
              <input type="text" data-field="city" placeholder="Paris" aria-label="Ville">
            </div>
          </div>
          <button type="button" class="secondary account-geoloc"><i class="fa-solid fa-location-crosshairs"></i>Géolocaliser</button>
          <div class="field">
            <label>Téléphone<input type="tel" data-field="phone"></label>
          </div>
          <div class="field">
            <label>URL d'envoi (Email)<input type="url" data-field="mailUrl" required placeholder="https://script.google.com/macros/s/…/exec"></label>
          </div>
          <div class="field">
            <label><span>URL de la passerelle PA <small class="opt">(optionnel)</small></span><input type="url" data-field="paUrl" placeholder="https://script.google.com/macros/s/…/exec"></label>
          </div>
          <div class="field">
            <label><span>Clé de la passerelle <small class="opt">(optionnel)</small></span><input type="password" data-field="paKey" autocomplete="off"></label>
          </div>
        </div>
        <div class="account-col">
          <h3 class="account-col-title">Informations légales</h3>
          <div class="field">
            <label>Profession(s) exercée(s)</label>
            <details class="pro-picker">
              <summary class="pro-summary">Sélectionner…</summary>
              <div class="pro-options"></div>
            </details>
          </div>
          <div class="pro-fields"></div>
          <div class="field">
            <label><span>SIRET <small class="opt">(optionnel)</small></span><input type="text" data-field="siret"></label>
          </div>
          <div class="field">
            <label><span>SIREN <small class="opt">(optionnel)</small></span><input type="text" data-field="siren"></label>
          </div>
          <div class="field">
            <label><span>N° TVA intracommunautaire <small class="opt">(optionnel)</small></span><input type="text" data-field="vatNumber" placeholder="FR00123456789"></label>
          </div>
          <div class="field">
            <label>Régime de TVA<select data-field="vatRegime">
              <option value="franchise">Franchise en base de TVA</option>
              <option value="taxable">Assujetti à la TVA</option>
            </select></label>
          </div>
          <div class="field vat-rate-field" hidden>
            <label>Taux de TVA (%)<input type="number" data-field="vatRate" min="0" step="0.1" placeholder="20"></label>
          </div>
        </div>
      </div>
      <button type="submit" disabled><i class="fa-solid fa-check"></i>Enregistrer</button>
      <button type="button" class="secondary account-cancel" disabled>Annuler les modifs</button>
      <div class="account-io">
        <button type="button" class="secondary" data-action="companyExport"><i class="fa-solid fa-file-arrow-down"></i>Exporter (.axo)</button>
        <button type="button" class="secondary" data-action="companyImport"><i class="fa-solid fa-file-import"></i>Importer (.axo)</button>
      </div>
    </form>
  </template>

  <template id="lineTpl">
    <div class="service-line">
      <div class="field svc-main">
        <label>Type de prestation</label>
        <select class="svc-type" required><option value="" disabled selected>Sélectionner une prestation…</option></select>
        <div class="svc-other">
          <input type="text" class="svc-desc" placeholder="Description">
          <input type="number" class="svc-price" placeholder="Prix (€)" min="0" step="0.01">
        </div>
      </div>
      <div class="field svc-qty">
        <label>Qté</label>
        <input type="number" min="1" step="1" value="1" required>
      </div>
      <button type="button" class="secondary danger svc-rm" title="Retirer"><i class="fa-solid fa-trash"></i></button>
    </div>
  </template>

  <template id="cardTpl">
    <article class="card">
      <div class="pfp"></div>
      <div class="info">
        <div class="row">
          <div>
            <strong class="c-name"></strong>
            <div class="meta c-svc"></div>
            <div class="meta email c-email"></div>
          </div>
          <div class="amount c-total"></div>
        </div>
        <div class="row">
          <div class="meta c-inv"></div>
          <div class="meta c-pay"></div>
          <div class="actions">
            <button type="button" class="secondary" data-act="download" title="Télécharger"><i class="fa-solid fa-download"></i></button>
            <button type="button" class="secondary" data-act="send" title="Envoyer"><i class="fa-solid fa-paper-plane"></i></button>
            <button type="button" class="secondary" data-act="pa" title="Transmettre à la plateforme agréée"><i class="fa-solid fa-building-columns"></i></button>
            <button type="button" class="secondary" data-act="edit" title="Modifier"><i class="fa-solid fa-pen"></i></button>
            <button type="button" class="secondary danger" data-act="delete" title="Supprimer"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      </div>
    </article>
  </template>
</body>
</html>
